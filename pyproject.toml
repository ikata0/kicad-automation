[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kat"
version = "0.1.0"
description = "KiCad automation tools: file-based schematic editing and checks for agents"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# SVG rasteriser for systems without rsvg-convert (e.g. Windows). AGPL-3.0 licensed.
render = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-xdist>=3", "skidl>=2.3"]
# `kat open --verify` for boards: talks to the running editor through KiCad's IPC API. MIT.
gui = ["kicad-python>=0.8"]
# `kat pcb netrule coupling --estimate 2d`: the cross-section Laplace solver. BSD.
field = ["numpy>=1.24", "scipy>=1.10"]
# `kat pcb polish`: route polishing (numpy constraints, PyTorch merit gradients). BSD.
polish = ["numpy>=1.24", "torch>=2.9"]
# `kat pcb polish run --gui`: the inspection window. LGPL-3.0.
polish-gui = ["PySide6>=6.8"]

[project.scripts]
kat = "kat.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"       # in parallel; -n0 to run in one process, e.g. with -s or --pdb
markers = ["slow: large end-to-end designs (LED matrix); deselect with -m 'not slow'",
           "kicad_gui: opens KiCad's editors (needs a display and kicad-python); only with -m kicad_gui"]
